name: Release

# Fires only when a version tag is pushed. Tagging is a deliberate human act —
# CI never tags (see docs/00-setup.md).
on:
  push:
    tags:
      - "v*"

# Least privilege: the GITHUB_TOKEN can only read. A job that needs more asks
# for it at job level.
permissions:
  contents: read

jobs:
  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Guard: the pushed tag must match indratrace.version.__version__. Prevents
      # tagging v0.2.0 while version.py still reads 0.1.0 — PyPI versions are
      # immutable, so a mismatched publish is unrecoverable. Fail loudly.
      # Read version.py as a standalone module (runpy) — importing the package
      # would drag in opentelemetry, which isn't installed at this step.
      - name: Assert tag matches package version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(python -c "import runpy; print(runpy.run_path('src/indratrace/version.py')['__version__'])")"
          echo "tag=$tag_version  package=$pkg_version"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::tag v$tag_version != version.py $pkg_version — refusing to build"
            exit 1
          fi

      - run: python -m pip install --upgrade pip build
      - run: python -m build

      - name: Check built metadata
        run: |
          pip install twine
          twine check dist/*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI (trusted publishing)
    needs: build
    runs-on: ubuntu-latest
    # The PyPI trusted-publishing configuration is bound to this environment and
    # workflow filename (docs/00-setup.md). No API token anywhere in the repo.
    environment: pypi
    permissions:
      contents: read
      id-token: write   # mint the short-lived OIDC token PyPI trusts
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
