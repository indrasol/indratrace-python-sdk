name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (a new push to a PR/branch).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the GITHUB_TOKEN can only read. A job that needs more asks
# for it at job level.
permissions:
  contents: read

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install ruff
      - run: ruff check .

  unit:
    name: unit (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      # Every extra, so no test silently `importorskip`s away — the django/flask
      # and loguru suites drive real minimal apps, and a green run must mean they
      # actually ran.
      - run: pip install -e ".[dev,fastapi,django,flask,anthropic,openai,gemini,bedrock,claude-agent-sdk]"
      # genai is a paid live-key ritual (stays local); integration needs the
      # harness (its own job below). This job is the pure-offline suite.
      - run: pytest -m "not integration and not genai" -q

  unit-floor:
    name: unit (py3.10, OpenTelemetry floor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade pip
      # The oldest OpenTelemetry pyproject.toml allows, forced, so the declared
      # floor is tested rather than assumed. Keep in step with pyproject.toml.
      - run: >-
          pip install -e ".[dev,fastapi,django,flask,anthropic,openai,gemini,bedrock,claude-agent-sdk]"
          "opentelemetry-sdk==1.41.*"
          "opentelemetry-exporter-otlp-proto-http==1.41.*"
      - run: pip list | grep -E "^opentelemetry-(api|sdk|exporter-otlp-proto-http) "
      - run: pytest -m "not integration and not genai" -q

  audit:
    name: audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      # Every runtime extra, so a vulnerable optional dependency is caught too.
      - run: pip install -e ".[fastapi,django,flask,anthropic,openai,gemini,bedrock,claude-agent-sdk]" pip-audit
      # --skip-editable: the local package is not on PyPI's advisory feed.
      - run: pip-audit --skip-editable

  integration:
    name: integration (harness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,fastapi]"

      - name: Start dev harness
        run: docker compose -f dev/docker-compose.yml up -d --wait

      # `--wait` only blocks on containers with a healthcheck. ClickHouse has
      # one; the collector does not, so poll its OTLP/HTTP port ourselves before
      # the tests import (they skip if it isn't listening at import time).
      - name: Wait for the collector's OTLP endpoint
        run: |
          for i in $(seq 1 30); do
            # An empty POST 400s on a live server; a successful *connection*
            # (curl exit 0, no -f) means it's listening — the 4xx is expected.
            if curl -s -o /dev/null --data-binary '' \
                http://localhost:4318/v1/traces; then
              echo "collector is listening"; exit 0
            fi
            echo "waiting for collector ($i)…"; sleep 2
          done
          echo "collector never came up"; docker compose -f dev/docker-compose.yml logs; exit 1

      - name: Run integration tests
        run: pytest -m integration -q

      - name: Tear down harness
        if: always()
        run: docker compose -f dev/docker-compose.yml down -v
